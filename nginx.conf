# Load static compression modules (order matters: last loaded = highest priority)
load_module modules/ngx_http_zstd_static_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
worker_rlimit_nofile 65535;
worker_cpu_affinity auto;

events {
  worker_connections 16384;
  multi_accept on;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # High-performance I/O
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  aio threads=default;
  aio_write on;
  directio 4m;
  output_buffers 2 512k;

  # Aggressive file caching
  open_file_cache max=200000 inactive=120s;
  open_file_cache_valid 180s;
  open_file_cache_min_uses 1;
  open_file_cache_errors on;

  # Connection optimization
  keepalive_timeout 65s;
  keepalive_requests 10000;
  reset_timedout_connection on;
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 10s;

  # Disable unnecessary features
  server_tokens off;
  etag on;
  if_modified_since before;

  # Precompressed files only (order determines priority)
  gzip off;
  brotli_static on;
  gzip_static on;
  zstd_static on;

  # Logging (disabled for max performance)
  access_log off;
  error_log /var/log/nginx/error.log error;

  server {
    # HTTP configuration
    listen 8080 reuseport backlog=65535 deferred so_keepalive=on;
    
    # Uncomment for HTTP/2 (nginx 1.25.1+)
    # listen 8080 reuseport backlog=65535 deferred http2 so_keepalive=on;
    
    # SSL/TLS configuration (uncomment to enable HTTPS)
    # listen 443 ssl reuseport backlog=65535 deferred so_keepalive=on http2;
    # 
    # # HTTP/3 (QUIC) - requires nginx 1.25.0+ compiled with --with-http_v3_module
    # listen 443 quic reuseport;
    # 
    # # Add Alt-Svc header to advertise HTTP/3 support
    # add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # 
    # ssl_certificate /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # 
    # # Enable early data for 0-RTT (optional, improves performance)
    # ssl_early_data on;
    # 
    # # Modern SSL configuration (Mozilla Intermediate)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    # ssl_prefer_server_ciphers off;
    # 
    # # SSL session cache for performance
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;
    # ssl_session_tickets off;
    # 
    # # OCSP stapling
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/nginx/ssl/chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;
    # 
    # # Security headers for HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    root /usr/share/nginx/html;
    index index.html;

    # Global security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Vary "Accept-Encoding" always;

    # Health check endpoint
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # Favicon optimization (often requested)
    location = /favicon.ico {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      log_not_found off;
      try_files $uri =404;
    }

    # Robots.txt optimization
    location = /robots.txt {
      add_header Cache-Control "public, max-age=86400" always;
      access_log off;
      log_not_found off;
      try_files $uri =204;
    }

    # Module Federation & metadata files: no caching
    location ~* ^/(remoteEntry\.js|@mf-types\.d\.ts|@mf-types\.zip|mf-manifest\.json|mf-stats\.json)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # SEO & validation files: no caching (sitemap, security.txt, etc.)
    location ~* ^/(sitemap\.xml|sitemap\.txt|security\.txt|humans\.txt|ads\.txt|robots\.txt)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # .well-known directory: no caching (SSL verification, security files)
    location ^~ /.well-known/ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # Service Worker & PWA files: no caching
    location ~* ^/(sw\.js|service-worker\.js|workbox-.*\.js|manifest\.json|manifest\.webmanifest)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      add_header Service-Worker-Allowed "/" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # Files WITHOUT numbers: no caching (likely not content-hashed)
    # This catches any static assets that don't have digits in the filename
    location ~* ^/[^?]*[^0-9][^?]*\.(css|js|mjs|wasm|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|ttf|eot|json|xml|txt)$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # HTML files: no caching (always fresh)
    location ~* \.html$ {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      # Brotli first, gzip fallback, zstd last
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # Root path: serve index.html without caching
    location = / {
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files /index.html =404;
    }

    # All other files: immutable long-term cache (content-hashed assets)
    location / {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      
      brotli_static on;
      gzip_static on;
      zstd_static on;
      
      try_files $uri =404;
    }

    # Optional: SPA fallback for client-side routing
    # Uncomment if your app uses React Router, Vue Router, etc.
    # location / {
    #   add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    #   brotli_static on;
    #   zstd_static on;
    #   gzip_static on;
    #   try_files $uri $uri/ /index.html;
    # }
  }
}